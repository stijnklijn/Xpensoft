name: Test, publish, deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"
      - name: Restore backend dependencies
        run: dotnet restore backend/Xpensoft.Api.slnx
      - name: Build backend
        run: dotnet build backend/Xpensoft.Api.slnx -c Release --no-restore
      - name: Run backend unit tests
        run: dotnet test backend/Xpensoft.Api.slnx -c Release --no-build
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build -- --configuration production
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test
    # if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: backend/Xpensoft.Api
          file: backend/Xpensoft.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/xpensoft-backend:latest
            ghcr.io/${{ github.repository_owner }}/xpensoft-backend:${{ github.sha }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/xpensoft-frontend:latest
            ghcr.io/${{ github.repository_owner }}/xpensoft-frontend:${{ github.sha }}
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: publish
    # if: github.event_name != 'pull_request'
    environment:
      name: production
      url: https://xpensoft.nl
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy to VPS
        shell: bash
        env:
          VPS_HOST: xpensoft.nl
          VPS_USER: xpensoft
          VPS_APP_DIR: /opt/xpensoft
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "VPS_APP_DIR='$VPS_APP_DIR' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
              set -Eeuo pipefail
              cd "$VPS_APP_DIR"
              if grep -q '^IMAGE_TAG=' .env; then
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
              else
                printf '\nIMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
              fi
              docker compose config --quiet
              docker compose pull
              docker compose up -d --remove-orphans --wait
              docker compose ps
          REMOTE
