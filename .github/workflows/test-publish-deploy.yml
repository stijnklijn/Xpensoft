name: Test, publish, deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"
      - name: Restore backend dependencies
        run: dotnet restore backend/Xpensoft.Api.slnx
      - name: Build backend
        run: dotnet build backend/Xpensoft.Api.slnx -c Release --no-restore
      - name: Run backend unit tests
        run: dotnet test backend/Xpensoft.Api.slnx -c Release --no-build
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build -- --configuration production
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test
    # if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: backend/Xpensoft.Api
          file: backend/Xpensoft.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/xpensoft-backend:latest
            ghcr.io/${{ github.repository_owner }}/xpensoft-backend:${{ github.sha }}
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: publish
    # if: github.event_name != 'pull_request'
    steps:
      - name: Placeholder for deployment steps
        run: echo "Deployment steps go here"
