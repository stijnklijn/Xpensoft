name: Test and deploy
on:
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:
jobs:
  test: #should run both on push and pull_request events
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"
      #should we include a build step here to ensure that the code compiles?
      - name: Run backend unit tests
        run: dotnet test backend/Xpensoft.Api.slnx
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      #should we include a build step here to ensure that the code compiles?
      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test
  deploy: #should run only on push events to main branch
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Placeholder for deployment steps
        run: echo "Deployment steps go here"
