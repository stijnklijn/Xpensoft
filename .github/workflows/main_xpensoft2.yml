name: Build and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      # .NET SETUP
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      # RESTORE + BUILD
      - name: Restore
        run: dotnet restore backend/Xpensoft.Api.slnx

      - name: Build
        run: dotnet build backend/Xpensoft.Api.slnx -c Release --no-restore

      # BACKEND TESTS
      - name: Run Backend Tests
        run: dotnet test backend/Xpensoft.Api.slnx

      # NODE SETUP
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # FRONTEND INSTALL + TESTS
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm run test

      # BUILD ANGULAR
      - name: Build Angular
        run: |
          cd frontend
          npm run build -- --configuration production

      # PUBLISH API PROJECT
      - name: Publish API Project
        run: dotnet publish backend/Xpensoft.Api/Xpensoft.Api.csproj -c Release -o publish

      # COPY ANGULAR → API
      - name: Copy Angular to wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r frontend/dist/frontend/browser/* publish/wwwroot

      # ARTIFACT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      # LOGIN TO AZURE
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2E453F6CFD5D4B33A6A7950FD23CE56B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_331179E36CCA4A0A82DE05D6EDF36A2A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2BAF3209B6234AFC93AD1CFC8AAB8325 }}

      # EF MIGRATIONS
      - name: Install EF Tool
        run: dotnet tool install --global dotnet-ef

      - name: Add tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Run EF Migrations
        run: dotnet ef database update --project backend/Xpensoft.Api/Xpensoft.Api.csproj
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.SQL_CONNECTION_STRING }}

      # DEPLOY TO AZURE
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "xpensoft2"
          slot-name: "Production"
          package: .
