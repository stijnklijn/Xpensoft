<div class="dialog">
  <header>
    <h3>{{ data.title }}</h3>
    <button class="close" mat-icon-button [mat-dialog-close]="false">✕</button>
  </header>
  <div class="message">
    <span>{{ data.message }}</span>
  </div>
  <div class="controls">
    <button mat-button [mat-dialog-close]="true">
      {{ 'SHARED.CONFIRM' | translate }}
    </button>
    <button mat-button [mat-dialog-close]="false">
      {{ 'SHARED.CANCEL' | translate }}
    </button>
  </div>
</div>
