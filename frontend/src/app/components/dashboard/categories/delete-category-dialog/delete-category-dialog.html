<div class="dialog">
  <header>
    <h3>{{ 'CATEGORIES.DIALOG.HEADER.DELETE' | translate }}</h3>
    <button class="close" mat-icon-button [disabled]="loading()" [matDialogClose]="null">✕</button>
  </header>
  <div class="message">
    <span>{{ 'CATEGORIES.DIALOG.CONFIRM_DELETE' | translate }}</span>
    <span>
      <strong>{{ data.name }}</strong
      >?</span
    >
  </div>
  <div class="controls">
    <button mat-button [disabled]="loading()" (click)="confirm()">
      @if (loading()) {
        <mat-spinner diameter="25"></mat-spinner>
      } @else {
        {{ 'SHARED.CONFIRM' | translate }}
      }
    </button>
    <button mat-button [disabled]="loading()" [matDialogClose]="null">
      {{ 'SHARED.CANCEL' | translate }}
    </button>
  </div>
</div>
